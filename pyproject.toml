[project]
name = "scm-iam-customer-api"
version = "0.1.0"
description = "Clean Architecture FastAPI example with IAM + Customer data scope"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy[asyncio]>=2.0,<2.2",
  "asyncpg>=0.30,<1.0",
  "pydantic-settings>=2.8,<3.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "alembic>=1.14,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.11,<1.0",
  "mypy>=1.15,<2.0",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "sql*", "alembic*"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
